# KnowLight Student Training Configuration

experiment:
  name: "knowlight"
  seed: 42
  device: "cuda" 

dataset:
  name: "movielens" 
  data_dir: "./data/raw"
  min_uc: 10 # k-core user filtering
  min_ic: 10 # k-core item filtering
  test_ratio: 0.2
  val_ratio: 0.1

student:
  model: "lightgcn"
  embedding_dim: 64
  n_layers: 3
  keep_prob: 0.6
  a_fold: 100

distillation:
  active: false
  alpha: 1.0
  beta: 0.0

training:
  epochs: 1000
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.01
  eval_step: 1
  patience: 10
  num_workers: 4

# Optimal dataset-specific hyperparameter overrides
dataset_hyperparams:
  movielens:
    lr: 0.01
    weight_decay: 0.001
  amazon_cd_2014:
    lr: 0.001
    weight_decay: 0.0001
  amazon_toys_and_games:
    lr: 0.001
    weight_decay: 0.001
  amazon_beauty:
    lr: 0.001
    weight_decay: 0.001
  yelp:
    lr: 0.001
    weight_decay: 0.0001

evaluation:
  top_k: [5, 10, 20]

