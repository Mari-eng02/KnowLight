# KnowLight Pipeline 2: LLMEmb Contrastive Embedding Alignment Configuration

experiment:
  name: "knowlight_contrastive_distillation"
  pipeline: "contrastive_distillation"
  seed: 42
  device: "cuda"

dataset:
  name: "movielens"
  data_dir: "./data/raw"
  min_uc: 10
  min_ic: 10
  test_ratio: 0.2
  val_ratio: 0.1

student:
  model: "lightgcn"
  embedding_dim: 64
  n_layers: 3
  keep_prob: 0.6
  a_fold: 100

distillation:
  active: true
  type: "contrastive"
  # Contrastive InfoNCE defaults
  lambda_item: 0.1  # Weight for Item Contrastive Loss L_item
  lambda_user: 0.0  # Weight for User Contrastive Loss L_user
  tau: 0.2          # InfoNCE Temperature hyperparameter
  # DE (Distillation Experts) defaults
  lambda_de: 0.01
  num_experts: 20
  temperature_de: 0.1
  # HTD (Hierarchical Topology Distillation) defaults
  lambda_td: 0.01
  alpha_htd: 0.5
  num_groups: 40
  topology_mode: "group_pe"
  initial_tau: 1.0
  min_tau: 1e-10
  decay_epochs: 100
  entity_sample_size: 256

training:
  epochs: 1000
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.01
  eval_step: 1
  patience: 10
  num_workers: 4

# Optimal dataset-specific hyperparameter overrides
dataset_hyperparams:
  movielens:
    lr: 0.01
    weight_decay: 0.001
  amazon_cd_2014:
    lr: 0.001
    weight_decay: 0.0001
  amazon_toys_and_games:
    lr: 0.001
    weight_decay: 0.001
  amazon_beauty:
    lr: 0.001
    weight_decay: 0.001
  yelp:
    lr: 0.001
    weight_decay: 0.0001

evaluation:
  top_k: [5, 10, 20]

